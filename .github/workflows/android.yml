name: Build PHENOMENA 1.3 Nocturne
on:
  push:
    branches: [main, release/modern-ui-1.3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack 70-hour Android source
        run: |
          test -s source/PHENOMENA-70h-Android-Source.tar.xz.base64
          # Preserve the current navigator and design over the archived 70-hour code.
          mkdir -p /tmp/phenomena-ui
          for f in Design.kt PhenomenaShell.kt ReadingScreens.kt KnowledgeScreens.kt; do
            cp "app/src/main/java/com/phenomena/study/ui/$f" "/tmp/phenomena-ui/$f"
          done
          # Keep the new native TTS engine controller and manifest over the archived edition.
          cp app/src/main/java/com/phenomena/study/player/StudyPlayer.kt /tmp/phenomena-upgraded-player.kt
          cp app/src/main/AndroidManifest.xml /tmp/phenomena-upgraded-manifest.xml
          cp app/src/main/res/values/styles.xml /tmp/phenomena-modern-styles.xml
          base64 --decode source/PHENOMENA-70h-Android-Source.tar.xz.base64 > /tmp/phenomena-70h.tar.xz
          tar -xJf /tmp/phenomena-70h.tar.xz --strip-components=1
          cp /tmp/phenomena-upgraded-player.kt app/src/main/java/com/phenomena/study/player/StudyPlayer.kt
          cp /tmp/phenomena-upgraded-manifest.xml app/src/main/AndroidManifest.xml
          cp /tmp/phenomena-modern-styles.xml app/src/main/res/values/styles.xml
          for f in Design.kt PhenomenaShell.kt ReadingScreens.kt KnowledgeScreens.kt; do
            cp "/tmp/phenomena-ui/$f" "app/src/main/java/com/phenomena/study/ui/$f"
          done
          python3 tools/patch_narrator_ui.py
          python3 tools/patch_modern_player.py
          sed -i 's/versionName = "1.0.0"/versionName = "1.3.0"/' app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 13/' app/build.gradle.kts
          test -s app/src/main/assets/seminars.json
          # Compilation compatibility fix until the source archive is regenerated.
          sed -i 's/class Catalog(context: Context) {/class Catalog(private val context: Context) {/' app/src/main/java/com/phenomena/study/data/Catalog.kt
          sed -i '/val result = candidates.maxByOrNull/c\        val result = candidates.maxByOrNull { entry: Pair<String, String> -> query.count { token: String -> entry.second.contains(token, ignoreCase = true) } } ?: candidates.first()' app/src/main/java/com/phenomena/study/data/StudyTutor.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK (preinstalled command-line tools)
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate lesson and audio catalog
        run: |
          python3 tools/validate_catalog.py
          python3 tools/validate_seminars.py
          python3 tools/validate_70h_catalog.py
          grep -q 'ModernLibraryScreen' app/src/main/java/com/phenomena/study/ui/PhenomenaShell.kt
          grep -q 'NarratorSettingsPanel' app/src/main/java/com/phenomena/study/ui/PlayerScreen.kt
          grep -q 'seminars.json' app/src/main/java/com/phenomena/study/data/Catalog.kt
      - name: Compile PHENOMENA debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PHENOMENA-1.3-Nocturne-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3.0-nocturne "app/build/outputs/apk/debug/app-debug.apk#PHENOMENA-1.3-Nocturne-debug.apk" --title "PHENOMENA 1.3 Nocturne · Modern Android UI" --notes "Refined premium dark editorial UI, searchable 56-work library, 70-hour phenomenology seminar curriculum, native Android TTS engine/voice selection, and stability fixes. Debug build for sideloading." || gh release upload v1.3.0-nocturne "app/build/outputs/apk/debug/app-debug.apk#PHENOMENA-1.3-Nocturne-debug.apk" --clobber
